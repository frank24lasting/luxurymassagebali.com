<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Luxury Massage Bali">
  <defs>
    <linearGradient id="lmb-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c068"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#9a7413"/>
    </linearGradient>
    <linearGradient id="lmb-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143329"/>
      <stop offset="100%" stop-color="#091b15"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#lmb-emerald)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#lmb-gold)" stroke-width="1.5" opacity="0.6"/>

  <!-- Lotus & Luxury Icon -->
  <g transform="translate(32, 32)">
    <!-- Central Lotus Petal -->
    <path d="M0,-16 C-3.5,-10 -3.5,-4 0,2 C3.5,-4 3.5,-10 0,-16" fill="url(#lmb-gold)"/>
    <!-- Left Petals -->
    <path d="M-8,-12 C-13,-6 -12,-1 -7,5 C-3,-1 -4,-6 -8,-12" fill="url(#lmb-gold)" opacity="0.85"/>
    <path d="M-14,-6 C-17,0 -16,5 -10,9 C-7,4 -8,0 -14,-6" fill="url(#lmb-gold)" opacity="0.7"/>
    <!-- Right Petals -->
    <path d="M8,-12 C13,-6 12,-1 7,5 C3,-1 4,-6 8,-12" fill="url(#lmb-gold)" opacity="0.85"/>
    <path d="M14,-6 C17,0 16,5 10,9 C7,4 8,0 14,-6" fill="url(#lmb-gold)" opacity="0.7"/>
    <!-- Base Crescent -->
    <path d="M-12,8 C-7,15 7,15 12,8 C6,11 -6,11 -12,8" fill="url(#lmb-gold)"/>
  </g>
</svg>